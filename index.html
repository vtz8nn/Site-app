<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockNotify - Gestão de Estoque</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-900 text-white py-6 px-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-boxes-stacked text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-tight">StockNotify <span class="text-xs bg-blue-600 px-2 py-0.5 rounded-full">PRO</span></h1>
      </div>
      <button onclick="enviarResumoDono()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="fa-brands fa-whatsapp text-sm"></i> Relatório Dono
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- KPIs / Dashboard Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-box text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Total de Itens</p>
          <p class="text-lg font-bold" id="kpi-total-itens">0</p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg"><i class="fa-solid fa-sack-dollar text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Valor em Estoque</p>
          <p class="text-lg font-bold" id="kpi-valor-total">R$ 0,00</p>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm col-span-2 md:col-span-1 flex items-center gap-3">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg"><i class="fa-solid fa-triangle-exclamation text-lg"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Alertas de Baixa</p>
          <p class="text-lg font-bold text-amber-600" id="kpi-alertas">0</p>
        </div>
      </div>
    </div>

    <!-- Configuração do Proprietário -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-user-shield text-slate-500"></i> Configuração da Empresa / Dono
      </h2>
      <div class="flex gap-2">
        <input type="text" id="whats-dono" placeholder="WhatsApp do Dono (com DDD ex: 5521999999999)" 
               class="flex-1 bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500"
               onchange="salvarWhatsDono()">
        <button onclick="salvarWhatsDono()" class="bg-slate-800 text-white text-xs px-4 rounded-lg font-medium hover:bg-slate-700">Salvar</button>
      </div>
    </div>

    <!-- Form de Cadastro -->
    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-blue-600"></i> Cadastrar Novo Produto
      </h2>
      <form id="form-produto" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Produto</label>
          <input type="text" id="nome" required placeholder="Ex: Camiseta Oversized" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Foto do Produto</label>
          <input type="file" id="foto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Preço de Venda (R$)</label>
          <input type="number" step="0.01" id="preco" required placeholder="49.90" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Quantidade Inicial</label>
          <input type="number" id="qtd" required placeholder="15" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Estoque Mínimo (Alerta)</label>
          <input type="number" id="qtd_min" required placeholder="5" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">WhatsApp do Fornecedor</label>
          <input type="text" id="whats" placeholder="5521988888888" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Salvar Produto no Estoque</button>
        </div>
      </form>
    </div>

    <!-- Busca e Lista de Produtos -->
    <div class="space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <h2 class="text-base font-bold text-slate-800">Catálogo de Produtos</h2>
        <input type="text" id="busca" onkeyup="filtrarProdutos()" placeholder="🔍 Buscar produto pelo nome..." class="bg-white border border-slate-300 text-xs rounded-lg p-2.5 w-full md:w-64 outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="lista-produtos"></div>
    </div>

  </main>

  <script>
    let produtos = JSON.parse(localStorage.getItem('produtos_estoque')) || [];
    let whatsDono = localStorage.getItem('whats_dono') || '';

    const form = document.getElementById('form-produto');
    const container = document.getElementById('lista-produtos');
    const inputWhatsDono = document.getElementById('whats-dono');

    if (whatsDono) inputWhatsDono.value = whatsDono;

    function salvarWhatsDono() {
      whatsDono = inputWhatsDono.value.replace(/\D/g, '');
      localStorage.setItem('whats_dono', whatsDono);
      alert("WhatsApp do proprietário salvo!");
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('foto');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => salvarProduto(reader.result);
        reader.readAsDataURL(file);
      } else {
        salvarProduto('https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?w=300&auto=format&fit=crop&q=60');
      }
    });

    function salvarProduto(fotoBase64) {
      const novoProduto = {
        id: Date.now(),
        nome: document.getElementById('nome').value,
        foto: fotoBase64,
        preco: parseFloat(document.getElementById('preco').value),
        qtd: parseInt(document.getElementById('qtd').value),
        qtd_min: parseInt(document.getElementById('qtd_min').value),
        whats: document.getElementById('whats').value.replace(/\D/g, '')
      };

      produtos.push(novoProduto);
      salvarERenderizar();
      form.reset();
    }

    function alterarQtd(id, delta) {
      let produtoAfetado = null;
      produtos = produtos.map(p => {
        if (p.id === id) {
          const novaQtd = p.qtd + delta;
          produtoAfetado = { ...p, qtd: novaQtd < 0 ? 0 : novaQtd };
          return produtoAfetado;
        }
        return p;
      });

      salvarERenderizar();

      if (delta === -1 && produtoAfetado && whatsDono) {
        notificarVendaDono(produtoAfetado);
      }
    }

    function removerProduto(id) {
      if (confirm("Remover este produto permanentemente?")) {
        produtos = produtos.filter(p => p.id !== id);
        salvarERenderizar();
      }
    }

    function notificarVendaDono(p) {
      const msg = encodeURIComponent(`🚨 *NOVA VENDA REGISTRADA*\n\n📦 Produto: ${p.nome}\n💵 Valor: R$ ${p.preco.toFixed(2)}\n📉 Estoque Restante: ${p.qtd} un.\nStatus: ${p.qtd <= p.qtd_min ? '⚠️ ESTOQUE BAIXO' : '✅ Ok'}`);
      window.open(`https://wa.me/${whatsDono}?text=${msg}`, '_blank');
    }

    function enviarResumoDono() {
      if (!whatsDono) return alert('Cadastre o WhatsApp do dono primeiro.');
      if (produtos.length === 0) return alert('Nenhum produto em estoque.');

      let texto = `📊 *RELATÓRIO DE ESTOQUE COMPLETO*\n\n`;
      produtos.forEach(p => {
        const status = p.qtd <= 0 ? '❌ ESGOTADO' : (p.qtd <= p.qtd_min ? '⚠️ BAIXO' : '✅ OK');
        texto += `• *${p.nome}*: ${p.qtd} un. | R$ ${p.preco.toFixed(2)} [${status}]\n`;
      });

      window.open(`https://wa.me/${whatsDono}?text=${encodeURIComponent(texto)}`, '_blank');
    }

    function filtrarProdutos() {
      const termo = document.getElementById('busca').value.toLowerCase();
      const cards = container.getElementsByClassName('card-item');
      Array.from(cards).forEach(card => {
        const nome = card.getAttribute('data-nome').toLowerCase();
        card.style.display = nome.includes(termo) ? 'flex' : 'none';
      });
    }

    function atualizarKPIs() {
      const totalItens = produtos.reduce((acc, p) => acc + p.qtd, 0);
      const valorTotal = produtos.reduce((acc, p) => acc + (p.qtd * p.preco), 0);
      const alertas = produtos.filter(p => p.qtd <= p.qtd_min).length;

      document.getElementById('kpi-total-itens').innerText = totalItens;
      document.getElementById('kpi-valor-total').innerText = `R$ ${valorTotal.toFixed(2)}`;
      document.getElementById('kpi-alertas').innerText = alertas;
    }

    function salvarERenderizar() {
      localStorage.setItem('produtos_estoque', JSON.stringify(produtos));
      container.innerHTML = '';
      atualizarKPIs();

      produtos.forEach(p => {
        let badgeBg = 'bg-emerald-500';
        let badgeTxt = 'Estoque OK';

        if (p.qtd <= 0) {
          badgeBg = 'bg-red-500';
          badgeTxt = 'Esgotado';
        } else if (p.qtd <= p.qtd_min) {
          badgeBg = 'bg-amber-500';
          badgeTxt = 'Estoque Baixo';
        }

        const msgWhatsFornecedor = encodeURIComponent(`Olá! Preciso reabastecer o produto: ${p.nome}. Estoque atual: ${p.qtd} unidade(s).`);
        const linkWhatsFornecedor = `https://wa.me/${p.whats}?text=${msgWhatsFornecedor}`;

        const card = document.createElement('div');
        card.className = 'card-item bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between relative';
        card.setAttribute('data-nome', p.nome);

        card.innerHTML = `
          <div>
            <span class="absolute top-3 right-3 text-[10px] uppercase font-bold text-white px-2 py-1 rounded-full ${badgeBg} z-10 shadow-sm">${badgeTxt}</span>
            <div class="h-40 w-full overflow-hidden bg-slate-100">
              <img src="${p.foto}" class="w-full h-full object-cover" alt="${p.nome}">
            </div>
            <div class="p-4">
              <h3 class="font-bold text-slate-800 text-sm line-clamp-1">${p.nome}</h3>
              <p class="text-xs font-semibold text-blue-600 mt-1">R$ ${p.preco.toFixed(2)}</p>
              <div class="mt-3 flex items-center justify-between text-xs text-slate-500 border-t border-slate-100 pt-2">
                <span>Estoque Atual:</span>
                <span class="font-bold text-sm text-slate-800">${p.qtd} <span class="text-[10px] text-slate-400 font-normal">(Mín: ${p.qtd_min})</span></span>
              </div>
            </div>
          </div>

          <div class="p-4 pt-0 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <button onclick="alterarQtd(${p.id}, -1)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-minus"></i> Venda
              </button>
              <button onclick="alterarQtd(${p.id}, 1)" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-plus"></i> Entrada
              </button>
            </div>

            ${p.qtd <= p.qtd_min && p.whats ? `
              <a href="${linkWhatsFornecedor}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-xs transition text-center flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp"></i> Reposição
              </a>` : ''}

            <button onclick="removerProduto(${p.id})" class="w-full text-slate-400 hover:text-red-600 text-xs py-1 transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-trash-can"></i> Excluir
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    salvarERenderizar();
  </script>
</body>
</html>
